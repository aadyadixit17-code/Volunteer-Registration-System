<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <!-- Google Font Import -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: url('https://static.vecteezy.com/system/resources/thumbnails/014/031/967/small/pastel-abstract-background-light-purple-abstract-design-for-poster-banner-flyer-leaflet-card-brochure-web-etc-vector.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif !important;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            margin-top: 0 !important;
        }
        .card {
            background-color: #f7f2fc !important; /* Light purple box */
            border: 1px solid #ebdcfc !important;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(110, 72, 145, 0.15) !important;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #593d88 !important; /* Purple Admin Login heading */
            font-weight: 600;
        }
        label {
            font-weight: 500;
            color: #4a2e7a;
        }
        .form-control {
            border-color: #d2bfe6;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .form-control:focus {
            border-color: #7b4cb0;
            box-shadow: 0 0 5px rgba(123, 76, 176, 0.3);
        }
        .btn-success {
            background-color: #7b4cb0 !important; /* Rich purple button */
            border-color: #7b4cb0 !important;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
        }
        .btn-success:hover {
            background-color: #653b94 !important;
            border-color: #653b94 !important;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow p-4 mx-auto">

        <h1 class="text-center mb-4">
            Admin Login
        </h1>

        <form method="POST">

            <div class="mb-3">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-success w-100">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
