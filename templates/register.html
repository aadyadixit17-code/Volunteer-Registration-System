<!DOCTYPE html>
<html>
<head>
    <title>Volunteer Registration</title>
    <!-- Google Font Import -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: url('https://www.shutterstock.com/image-vector/light-purple-vector-abstract-background-260nw-2193071641.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif !important;
        }
        .card {
            background-color: #f7f2fc !important; /* Light purple box */
            border: 1px solid #ebdcfc !important;
            border-radius: 12px;
        }
        h1 {
            color: #593d88 !important; /* Theme heading color */
            font-weight: 600;
        }
        label {
            font-weight: 500;
            color: #4a2e7a;
        }
        .form-control {
            border-color: #d2bfe6;
        }
        .form-control:focus {
            border-color: #7b4cb0;
            box-shadow: 0 0 5px rgba(123, 76, 176, 0.3);
        }
        .btn-primary {
            background-color: #7b4cb0 !important; /* Rich purple button */
            border-color: #7b4cb0 !important;
            font-weight: 500;
            padding: 10px;
        }
        .btn-primary:hover {
            background-color: #653b94 !important;
            border-color: #653b94 !important;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto" style="max-width:600px;">

        <h1 class="text-center mb-4">
            Volunteer Registration
        </h1>

        <form method="POST">

            <div class="mb-3">
                <label>Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input type="text"
                       name="phone"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Skills</label>
                <input type="text"
                       name="skills"
                       class="form-control"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>

</div>

</body>
</html>
