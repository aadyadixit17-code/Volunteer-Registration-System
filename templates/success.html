<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://img.magnific.com/free-vector/powder-pastel-with-hand-drawn-elements-background_23-2148583786.jpg?semt=ais_hybrid&w=740&q=80') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .success-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }
        .cartoon-container {
            background-color: #f7f2fc;
            border: 1px solid #ebdcfc;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(110, 72, 145, 0.15);
            text-align: center;
        }
        .cartoon-img {
            width: 240px;
            height: auto;
            /* Flip image horizontally so hands point towards the right */
            transform: scaleX(-1);
        }
        .success-box {
            background-color: #f7f2fc;
            border: 1px solid #ebdcfc;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(110, 72, 145, 0.15);
            text-align: center;
            flex-grow: 1;
        }
        h2 {
            color: #593d88;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .action-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        .action-links a {
            display: inline-block;
            background-color: #7b4cb0;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .action-links a:hover {
            background-color: #653b94;
            color: white;
        }
    </style>
</head>
<body>

<div class="success-wrapper">
    <!-- Cartoon on the Left (flipped to point right) -->
    <div class="cartoon-container">
        <img src="https://static.vecteezy.com/system/resources/previews/070/809/825/non_2x/cartoon-style-cheerful-man-pointing-fingers-flat-illustration-artwork-asset-vector.jpg" alt="Pointing Cartoon" class="cartoon-img">
    </div>

    <!-- Success Message Box on the Right -->
    <div class="success-box">
        <h2>Registration Successful! 🎉</h2>
        <p style="color: #4a2e7a; margin-bottom: 15px;">Thank you for registering as a volunteer. You can now access your dashboard or register another volunteer.</p>
        
        <div class="action-links">
            <a href="/">Register Another</a>
            <a href="/login">Admin Login</a>
        </div>
    </div>
</div>

</body>
</html>
